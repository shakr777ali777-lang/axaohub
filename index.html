<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXAOHUB - الوسائط</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>body{font-family:'Tajawal',sans-serif}.no-scrollbar::-webkit-scrollbar{display:none}</style>
</head>
<body class="bg-[#f5f5f7]">
<div class="max-w-[500px] mx-auto bg-white min-h-screen relative pb-[90px]">
  <!-- Top Bar -->
  <div class="sticky top-0 z-20 bg-white/90 backdrop-blur px-4 py-4 flex justify-between items-center border-b">
    <div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center">☰</div>
    <h1 class="font-extrabold text-[22px] tracking-tight">AXAOHUB.COM</h1>
    <div class="w-10 h-10"></div>
  </div>
  <div class="px-4 py-3">
    <h2 class="font-bold text-[20px]">الوسائط</h2>
    <p class="text-gray-500 text-[13px]">اختار أداة وارفع صورتك - التوليد فوري ومجاني</p>
  </div>
  <!-- Tabs -->
  <div class="mx-3 bg-[#f0f0f2] rounded-full p-1 flex text-[13px] font-bold">
    <button class="flex-1 py-2">المستوردة</button>
    <button class="flex-1 py-2">المنشأة</button>
    <button class="flex-1 py-2 bg-white rounded-full shadow">التعيينات المسبقة</button>
  </div>
  <!-- GRID ALL TOOLS -->
  <div id="grid" class="grid grid-cols-2 gap-[3px] mt-3"></div>

  <!-- Bottom Search like screenshot -->
  <div class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[92%] max-w-[460px] bg-white rounded-[26px] shadow-[0_10px_40px_rgba(0,0,0,0.18)] border p-2.5 flex items-center gap-2 z-30">
    <div class="w-9 h-9 rounded-full border flex items-center justify-center text-xl">+</div>
    <span class="flex-1 text-right text-gray-400 text-[14px]">اسأل أي شيء...</span>
    <span class="bg-black text-white px-4 py-1.5 rounded-full text-[12px]">فوري</span>
  </div>
</div>

<!-- MODAL -->
<div id="modal" class="fixed inset-0 bg-black/75 z-40 hidden items-end">
  <div class="bg-white w-full max-w-[500px] mx-auto rounded-t-[22px] p-5 max-h-[90vh] overflow-y-auto">
    <div class="flex justify-between items-center mb-3">
      <h3 id="mTitle" class="font-extrabold text-[16px]"></h3>
      <button onclick="closeM()" class="w-8 h-8 bg-gray-100 rounded-full">✕</button>
    </div>
    <input type="file" id="file" accept="image/*" class="w-full text-sm mb-3">
    <div class="grid grid-cols-2 gap-2">
      <div><p class="text-xs text-gray-500 mb-1">صورتك</p><img id="preview" class="w-full h-48 object-cover rounded-xl bg-gray-100 hidden"></div>
      <div><p class="text-xs text-gray-500 mb-1">النتيجة</p><img id="result" class="w-full h-48 object-cover rounded-xl bg-gray-100 hidden"><div id="loader" class="hidden h-48 bg-gray-100 rounded-xl flex items-center justify-center text-sm">⏳ جاري التوليد...</div></div>
    </div>
    <button id="gen" class="w-full mt-4 bg-black text-white py-3.5 rounded-full font-bold text-[15px]">توليد فوري مجاني</button>
    <p id="status" class="text-center text-[12px] text-gray-500 mt-2"></p>
    <div id="shareBox" class="hidden grid grid-cols-3 gap-2 mt-3">
      <button onclick="shareWA()" class="bg-[#25D366] text-white py-2.5 rounded-full text-sm font-bold">واتساب</button>
      <button onclick="downloadImg()" class="bg-gray-900 text-white py-2.5 rounded-full text-sm font-bold">تحميل HD</button>
      <button onclick="closeM()" class="bg-gray-100 py-2.5 rounded-full text-sm font-bold">أداة ثانية</button>
    </div>
  </div>
</div>

<script>
const tools=[
{n:'رسم تخطيطي متفجر', d:'قم بعمل رسم تخطيطي متفجر من هذه الصورة', p:'exploded view diagram blueprint technical', img:'https://images.unsplash.com/photo-1580894906475-403276d3942d?w=400'},
{n:'دمج حركة', d:'حولني إلى دمج حركة', p:'action figure toy in motion blur, dynamic pose', img:'https://images.unsplash.com/photo-1596461404969-9ae70f2830c1?w=400'},
{n:'رقص الماكارينا', d:'حول الصورة إلى GIF رقص الماكارينا', p:'person dancing macarena funny dance', img:'https://images.unsplash.com/photo-1508700929628-666bc8bd84ea?w=400'},
{n:'استعادة الصورة', d:'تطبيق استعادة الصورة لهذه الصورة', p:'photo restoration colorized 4k ultra detailed old photo', img:'https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=400'},
{n:'دمية كروشيه', d:'حول صورتي إلى دمية كروشيه', p:'cute crochet amigurumi doll handmade wool', img:'https://images.unsplash.com/photo-1515488042361-ee00e0ddd4e4?w=400'},
{n:'فن بيكسل', d:'حول الصورة إلى فن بيكسل', p:'8-bit pixel art portrait retro game', img:'https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=400'},
{n:'شخصية GTA', d:'حولني إلى شخصية GTA 6', p:'GTA 6 style character, video game cover art', img:'https://images.unsplash.com/photo-1493711662062-fa541adb3fc8?w=400'},
{n:'أنمي ياباني', d:'حول صورتي إلى أنمي ياباني', p:'anime portrait studio ghibli style', img:'https://images.unsplash.com/photo-1578662996442-48f60103fc96?w=400'},
{n:'دمية باربي', d:'حولني إلى دمية باربي', p:'barbie doll plastic toy box style', img:'https://images.unsplash.com/photo-1596461404969-9ae70f2830c1?w=400'},
{n:'ليغو', d:'حول صورتي إلى ليغو', p:'lego minifigure portrait', img:'https://images.unsplash.com/photo-1587654780291-39c9404d746b?w=400'},
{n:'ثلاثي الأبعاد', d:'حول الصورة إلى 3D كرتوني', p:'3d pixar style character, cute render', img:'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400'},
{n:'ملك خليجي', d:'حولني إلى شيخ خليجي فخم', p:'arabian sheikh with bisht and luxury g class, royal', img:'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400'},
{n:'إزالة الخلفية', d:'إزالة الخلفية بجودة HD', p:'person isolated on white background studio', img:'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400'},
{n:'تكبير 4K', d:'تكبير الصورة إلى 4K', p:'ultra sharp 4k upscaled portrait, highly detailed', img:'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=400'},
{n:'كاريكاتير', d:'حول الصورة إلى كاريكاتير مضحك', p:'funny caricature exaggerated face', img:'https://images.unsplash.com/photo-1513364776144-60967b0f800f?w=400'},
{n:'زمن التسعينات', d:'شكلي في التسعينات', p:'90s vintage yearbook photo style', img:'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=400'},
{n:'بطل خارق', d:'حولني إلى بطل خارق', p:'superhero marvel style costume', img:'https://images.unsplash.com/photo-1531259683007-016a7bbe742f?w=400'},
{n:'لوحة زيتية', d:'حول الصورة إلى لوحة زيتية ملكية', p:'oil painting royal portrait renaissance', img:'https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?w=400'},
];

const grid=document.getElementById('grid');
tools.forEach((t,i)=>{
 grid.innerHTML+=`<div onclick="openM(${i})" class="relative h-[190px] cursor-pointer overflow-hidden group">
 <img src="${t.img}" class="w-full h-full object-cover group-active:scale-105 transition">
 <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/10 to-transparent"></div>
 <p class="absolute bottom-2 right-2 left-2 text-white text-[12.5px] font-bold leading-[14px]">${t.d}</p>
 </div>`;
});

let cur=null, curUrl='', uploaded=null;
function openM(i){cur=tools[i]; document.getElementById('mTitle').innerText=cur.d; document.getElementById('modal').classList.remove('hidden'); document.getElementById('modal').classList.add('flex');}
function closeM(){document.getElementById('modal').classList.add('hidden'); document.getElementById('modal').classList.remove('flex');}
document.getElementById('file').addEventListener('change',e=>{
 const f=e.target.files[0]; if(!f) return;
 const r=new FileReader(); r.onload=ev=>{uploaded=ev.target.result; const p=document.getElementById('preview'); p.src=uploaded; p.classList.remove('hidden');}; r.readAsDataURL(f);
});
document.getElementById('gen').addEventListener('click',()=>{
 if(!uploaded){document.getElementById('status').innerText='ارفع صورتك أولاً'; return;}
 const loader=document.getElementById('loader'), res=document.getElementById('result'), status=document.getElementById('status');
 loader.classList.remove('hidden'); res.classList.add('hidden'); status.innerText='الذكاء الاصطناعي يشتغل...';
 const seed=Math.floor(Math.random()*999999);
 const prompt=encodeURIComponent(cur.p+' , watermark text AXAOHUB.COM at bottom');
 const url=`https://image.pollinations.ai/prompt/${prompt}?seed=${seed}&width=768&height=768&nologo=false&model=flux`;
 res.src=url;
 res.onload=()=>{loader.classList.add('hidden'); res.classList.remove('hidden'); status.innerText='تم! 🚀'; document.getElementById('shareBox').classList.remove('hidden'); curUrl=url;};
});
function downloadImg(){const a=document.createElement('a'); a.href=curUrl; a.download='axaohub.jpg'; a.click();}
function shareWA(){const t=encodeURIComponent('جربت هذا الفلتر الرهيب 😍 : https://axaohub.com'); window.open('https://wa.me/?text='+t,'_blank');}
</script>
</body>
</html>
